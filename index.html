<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cicerone Certified Beer Server Exam Prep</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary: #d97706;
            --primary-hover: #b45309;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.25rem; margin: 0; color: var(--primary); }
        .btn-small { background: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        .mode-select { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
        .btn-main:hover { background: var(--primary-hover); }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; text-align: center; }
        .stat-card { background: var(--bg-color); padding: 10px 4px; border-radius: 8px; }
        .stat-val { font-size: 1.1rem; font-weight: bold; }
        .stat-lbl { font-size: 0.7rem; color: #64748b; }

        .history-section { border-top: 2px solid var(--border); padding-top: 16px; }
        .history-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; }
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .history-item { background: var(--bg-color); padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .history-tag { font-weight: bold; color: var(--primary); }

        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .q-meta { font-size: 0.85rem; color: #64748b; font-weight: bold; }
        .bookmark-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #cbd5e1; }
        .bookmark-btn.active { color: #f59e0b; }

        .q-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; line-height: 1.4; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .opt-btn { background: white; border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; text-align: left; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        .opt-btn.correct { background: #dcfce7; border-color: var(--correct); color: #14532d; font-weight: bold; }
        .opt-btn.incorrect { background: #fee2e2; border-color: var(--incorrect); color: #7f1d1d; }

        .feedback { background: #f8fafc; border-left: 4px solid var(--primary); padding: 12px; border-radius: 4px; margin-bottom: 16px; font-size: 0.9rem; line-height: 1.4; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🍺 Cicerone Server Prep</h1>
        <button id="home-btn" class="btn-small hidden" onclick="showDashboard()">Dashboard</button>
    </header>

    <div id="dashboard-view">
        <div class="stats-grid">
            <div class="stat-card"><div id="stat-total" class="stat-val">0</div><div class="stat-lbl">Seen</div></div>
            <div class="stat-card"><div id="stat-accuracy" class="stat-val">0%</div><div class="stat-lbl">Accuracy</div></div>
            <div class="stat-card"><div id="stat-bookmarks" class="stat-val">0</div><div class="stat-lbl">Saved</div></div>
            <div class="stat-card"><div id="stat-weakness" class="stat-val" style="color:#dc2626;">0</div><div class="stat-lbl">Missed</div></div>
        </div>

        <div class="mode-select">
            <button class="btn-main" onclick="startQuiz(25)">25-Question Sprint</button>
            <button class="btn-main" onclick="startQuiz(50)">50-Question Practice Exam</button>
            <button id="weak-btn" class="btn-main" style="background:#dc2626;" onclick="startQuiz('weak')">Focus on Weak Areas (0)</button>
            <button class="btn-main" style="background:#475569;" onclick="startQuiz('bookmarks')">Review Saved Questions</button>
        </div>

        <div class="history-section">
            <div class="history-title">
                <span>Recent Exam History</span>
                <button class="btn-small" onclick="clearHistory()" style="font-size:0.7rem;">Clear Log</button>
            </div>
            <div id="history-list" class="history-list">
                <div style="font-size:0.85rem; color:#94a3b8; text-align:center; padding:10px;">No exams completed yet.</div>
            </div>
        </div>
    </div>

    <div id="quiz-view" class="hidden">
        <div class="q-header">
            <span id="q-progress" class="q-meta">Question 1/25</span>
            <button id="bookmark-toggle" class="bookmark-btn" onclick="toggleBookmark()">★</button>
        </div>

        <div id="q-text" class="q-text"></div>
        <div id="options-container" class="options"></div>

        <div id="feedback-box" class="feedback hidden">
            <strong>Explanation:</strong> <span id="feedback-text"></span>
        </div>

        <button id="next-btn" class="btn-main hidden" style="width:100%;" onclick="nextQuestion()">Next Question</button>
    </div>
</div>
