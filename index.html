<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cicerone Certified Beer Server Exam Prep</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary: #d97706;
            --primary-hover: #b45309;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.25rem; margin: 0; color: var(--primary); }
        .btn-small { background: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        .mode-select { display: flex; flex-direction: column; gap: 12px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-align: center; }
        .btn-main:hover { background: var(--primary-hover); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; text-align: center; }
        .stat-card { background: var(--bg-color); padding: 10px; border-radius: 8px; }
        .stat-val { font-size: 1.25rem; font-weight: bold; }
        .stat-lbl { font-size: 0.75rem; color: #64748b; }

        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .q-meta { font-size: 0.85rem; color: #64748b; font-weight: bold; }
        .bookmark-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #cbd5e1; }
        .bookmark-btn.active { color: #f59e0b; }

        .q-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; line-height: 1.4; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .opt-btn { background: white; border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; text-align: left; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        .opt-btn.correct { background: #dcfce7; border-color: var(--correct); color: #14532d; font-weight: bold; }
        .opt-btn.incorrect { background: #fee2e2; border-color: var(--incorrect); color: #7f1d1d; }

        .feedback { background: #f8fafc; border-left: 4px solid var(--primary); padding: 12px; border-radius: 4px; margin-bottom: 16px; font-size: 0.9rem; line-height: 1.4; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🍺 Cicerone Server Prep</h1>
        <button id="home-btn" class="btn-small hidden" onclick="showDashboard()">Dashboard</button>
    </header>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view">
        <div class="stats-grid">
            <div class="stat-card"><div id="stat-total" class="stat-val">0</div><div class="stat-lbl">Attempted</div></div>
            <div class="stat-card"><div id="stat-accuracy" class="stat-val">0%</div><div class="stat-lbl">Accuracy</div></div>
            <div class="stat-card"><div id="stat-bookmarks" class="stat-val">0</div><div class="stat-lbl">Bookmarked</div></div>
        </div>

        <div class="mode-select">
            <button class="btn-main" onclick="startQuiz(25)">25-Question Sprint</button>
            <button class="btn-main" onclick="startQuiz(50)">50-Question Practice Exam</button>
            <button class="btn-main" style="background:#475569;" onclick="startQuiz('bookmarks')">Review Bookmarked Questions</button>
        </div>
    </div>

    <!-- QUIZ VIEW -->
    <div id="quiz-view" class="hidden">
        <div class="q-header">
            <span id="q-progress" class="q-meta">Question 1/25</span>
            <button id="bookmark-toggle" class="bookmark-btn" onclick="toggleBookmark()">★</button>
        </div>

        <div id="q-text" class="q-text"></div>
        <div id="options-container" class="options"></div>

        <div id="feedback-box" class="feedback hidden">
            <strong>Explanation:</strong> <span id="feedback-text"></span>
        </div>

        <button id="next-btn" class="btn-main hidden" style="width:100%;" onclick="nextQuestion()">Next Question</button>
    </div>
</div>

<script>
// Expanded Bank of 50 Unique Cicerone CBS Questions
const questionBank = [
    { id: 1, q: "At what temperature should a standard direct-draw draft system be maintained?", opts: ["32°F (0°C)", "38°F (3°C)", "45°F (7°C)", "50°F (10°C)"], ans: 1, exp: "38°F is the standard operating temperature for draft systems to maintain equilibrium pressure and prevent foaming." },
    { id: 2, q: "How long should a cold keg sit in a walk-in cooler before being tapped to ensure it reaches proper temperature?", opts: ["2 hours", "6 hours", "12 hours", "24 hours"], ans: 3, exp: "Kegs require 24 hours in a walk-in cooler to stabilize at proper service temperature (38°F)." },
    { id: 3, q: "What flavor profile is primarily contributed by German Weissbier yeast?", opts: ["Citrus and Pine", "Banana and Clove", "Green Apple and Butter", "Roast and Chocolate"], ans: 1, exp: "German Weissbier yeast strains generate isoamyl acetate (banana esters) and 4-vinyl guaiacol (clove phenols)." },
    { id: 4, q: "What caustic chemical concentration is standard for routine draft line cleaning every 2 weeks?", opts: ["2% Caustic Solution", "1% Acid Solution", "5% Bleach", "10% Caustic Solution"], ans: 0, exp: "A 2% or greater caustic solution (3% for older/longer systems) heated to 80-110°F is standard for bi-weekly maintenance." },
    { id: 5, q: "What is a primary visual indicator that a glass is NOT 'beer clean' when filled with liquid?", opts: ["Lacing clinging to the sides", "A thick, dense foam head", "Bubbles clinging to the inside walls of the glass", "Condensation forming on the outside"], ans: 2, exp: "Bubbles sticking to the inside wall of a glass indicate residual grease, oil, or soil breaking surface tension." },
    { id: 6, q: "Which beer style traditionally exhibits a low level of diacetyl (butter/butterscotch) as an acceptable style trait?", opts: ["German Pils", "Czech Premium Pale Lager", "Doppelbock", "American IPA"], ans: 1, exp: "Czech Premium Pale Lager (Bohemian Pilsner) permits a low level of diacetyl, unlike German Pils." },
    { id: 7, q: "What primary flavor attribute comes from heavily roasted malts?", opts: ["White bread and water cracker", "Toffee and caramel", "Espresso and dark chocolate", "Peppery spice"], ans: 2, exp: "Highly kilned and roasted malts yield roast coffee, dark chocolate, and cocoa notes." },
    { id: 8, q: "Why must the draft faucet spout NEVER submerge into the beer during a pour?", opts: ["It causes immediate flat beer", "It creates cross-contamination and bacterial growth", "It over-carbonates the glass", "It damages the faucet seal"], ans: 1, exp: "Submerging the spout transfers glassware bacteria back to the faucet, creating sanitation risks." },
    { id: 9, q: "How often should draft lines be cleaned with an acid solution to remove beer stone deposits?", opts: ["Every week", "Every 2 weeks", "Quarterly (every 3 months)", "Once a year"], ans: 2, exp: "Acid cleaning is required quarterly (every 12 weeks) to remove inorganic mineral scale (calcium oxalate)." },
    { id: 10, q: "Which style features significant lactic sourness paired with salt and coriander?", opts: ["Berliner Weisse", "Gose", "Gueuze", "Flanders Red"], ans: 1, exp: "Gose is a traditional German sour wheat ale brewed with coriander seed and salt." },
    { id: 11, q: "What cause is most likely responsible for beer spurting or foaming excessively from a draft faucet?", opts: ["Temperature is too cold", "Applied gas pressure is too high or beer is too warm", "Draft line is too short", "Glass is too clean"], ans: 1, exp: "Warm beer temperatures or incorrect gas pressure balance cause CO2 to break out of solution, leading to foam." },
    { id: 12, q: "Which gas mixture is typically used in long-draw draft systems to prevent over-carbonation?", opts: ["100% Compressed Air", "100% Nitrogen", "CO2 and Nitrogen blend", "Oxygen and CO2 blend"], ans: 2, exp: "A CO2/Nitrogen gas blend (e.g., 60/40 or 70/30) allows higher pressure to push beer long distances without over-carbonating." },
    { id: 13, q: "What off-flavor is characterized by notes of green apple or freshly cut pumpkin?", opts: ["Diacetyl", "Acetaldehyde", "DMS (Dimethyl Sulfide)", "Trans-2-nonenal"], ans: 1, exp: "Acetaldehyde is an intermediate compound in fermentation that tastes like green apples when under-attenuated or aged prematurely." },
    { id: 14, q: "Which glass cleaning test involves sprinkling salt inside a damp glass?", opts: ["Lacing Test", "Salt Test", "Sheeting Test", "Rinse Test"], ans: 1, exp: "In the Salt Test, salt will not stick to areas containing oil or grease residue, leaving bare patches inside the glass." },
    { id: 15, q: "What off-flavor produces a cooked corn or creamed corn aroma?", opts: ["DMS (Dimethyl Sulfide)", "Acetaldehyde", "Oxidation", "Lightstruck"], ans: 0, exp: "DMS (Dimethyl Sulfide) imparts a cooked corn flavor, derived from precursor compounds found in pale malts." },
    { id: 16, q: "Which hop variety family is most known for resinous, piney, and citrusy (grapefruit) characteristics?", opts: ["Noble German Hops", "English Terroir Hops", "American Pacific Northwest Hops", "Saazer Hops"], ans: 2, exp: "American hops (like Cascade, Centennial, and Simcoe) are prominent for citrus, pine, and resinous aromatics." },
    { id: 17, q: "What wavelength of light is most responsible for causing 'skunked' or lightstruck beer?", opts: ["Infrared light", "Ultraviolet and visible blue light", "Red visible light", "Gamma radiation"], ans: 1, exp: "UV and visible blue light break down hop alpha acids, reacting with sulfur compounds to create the lightstruck aroma." },
    { id: 18, q: "Which glass color provides the greatest protection against beer becoming lightstruck?", opts: ["Clear glass", "Green glass", "Brown glass", "Blue glass"], ans: 2, exp: "Brown glass blocks roughly 98% of harmful light wavelengths; green glass offers minimal protection, and clear offers none." },
    { id: 19, q: "What component in a draft system prevents beer from flowing backward into the gas regulator line?", opts: ["FOB (Foam-on-Beer) detector", "Coupler check valve", "Faucet washer", "Shank tailpiece"], ans: 1, exp: "The Thomas valve / check valve inside the keg coupler prevents liquid from backing up into the gas hose." },
    { id: 20, q: "What is the primary function of a FOB (Foam-On-Beer) device in a long-draw draft system?", opts: ["It chills the beer line", "It shuts off beer flow when a keg empties to keep lines full of liquid", "It mixes nitrogen into the beer", "It filters sediment"], ans: 1, exp: "A FOB stops flow immediately when a keg empties, keeping the line full of beer and preventing gas purge waste." },
    { id: 21, q: "What is the dominant malt flavor profile of a classic Belgian Dubbel?", opts: ["Sharp burnt roast", "Dark fruit, caramel, and raisin", "Bready crackers and straw", "Pecan and buttery biscuit"], ans: 1, exp: "Belgian Dubbels highlight dark fruit (plum, raisin) and caramelized sugar notes alongside Belgian yeast esters." },
    { id: 22, q: "At what temperature range should robust, dark beers like Imperial Stouts or Barleywines ideally be served?", opts: ["33°F - 35°F", "38°F - 42°F", "45°F - 55°F", "65°F - 70°F"], ans: 2, exp: "Full-bodied dark ales open up flavor complexity at slightly warmer cellar temperatures (45°F - 55°F)." },
    { id: 23, q: "Which beer style traditionally uses 100% malted wheat without barley?", opts: ["Berliner Weisse", "German Hefeweizen", "No traditional beer uses 100% wheat malt", "Witbier"], ans: 2, exp: "Malted wheat lacks husks for lautering, so wheat beers typically max out at 50%–70% wheat malt paired with malted barley." },
    { id: 24, q: "What causes paper, cardboard, or stale off-flavors in aged beer?", opts: ["Infection by Pediococcus", "Oxidation (Trans-2-nonenal)", "Excessive boil time", "High fermentation temperature"], ans: 1, exp: "Exposure to oxygen over time forms trans-2-nonenal, imparting wet cardboard and stale paper notes." },
    { id: 25, q: "What type of water rinsing device is mounted on a bar counter to wet glasses immediately before pouring?", opts: ["Glass Rinner / Star Washer", "Draft coupler", "Jumper line", "Spigot aerator"], ans: 0, exp: "A glass rinser removes residual dust and cools down the glass interior prior to pouring draft beer." },
    { id: 26, q: "Which classic Belgian style is unblended, spontaneously fermented, and famously tart and dry?", opts: ["Flanders Red", "Straight Lambic", "Dubbel", "Saison"], ans: 1, exp: "Straight Lambic is an unblended, spontaneously fermented sour ale brewed in the Zenne Valley." },
    { id: 27, q: "What is the primary characteristic of an English IPA compared to an American IPA?", opts: ["Higher carbonation and citrus hops", "Herbal/earthy hop character with herbal malt balance", "Strong sourness", "Roasty chocolate flavors"], ans: 1, exp: "English IPAs feature native Goldings or Fuggles hops (earthy/floral) paired with toasted English malt balance." },
    { id: 28, q: "How often should couplers and faucets be completely disassembled and scrubbed during line cleaning?", opts: ["Every week", "Every 2 weeks", "Every month", "Once per year"], ans: 1, exp: "Faucets and couplers should be dismantled and manually brushed clean every two weeks during routine line service." },
    { id: 29, q: "Which style is a pale, cold-fermented German lager with clean, crisp maltiness and low bitterness from Cologne?", opts: ["Kölsch", "Altbier", "Märzen", "Vienna Lager"], ans: 0, exp: "Kölsch is warm-fermented with ale yeast but cold-conditioned (lagered), originating from Cologne (Köln)." },
    { id: 30, q: "What flavor does Isovaleric Acid contribute to beer when ingredients deteriorate?", opts: ["Butterscotch", "Cheesy or stale sweaty socks", "Green apple", "Clove spice"], ans: 1, exp: "Isovaleric acid develops from old, oxidized hops, contributing cheesy or sweaty sock notes." },
    { id: 31, q: "What is the standard volume percentage of alcohol by volume (ABV) for a typical American Lager?", opts: ["2.5% - 3.5%", "4.2% - 5.3%", "6.5% - 7.5%", "8.0% - 9.5%"], ans: 1, exp: "Standard American Lagers typically fall in the 4.2% to 5.3% ABV range." },
    { id: 32, q: "Which Belgian style utilizes orange peel and coriander seed in its grist bill?", opts: ["Belgian Tripel", "Witbier", "Saison", "Belgian Blond Ale"], ans: 1, exp: "Witbier is a spiced Belgian wheat ale traditionally brewed with Curaçao orange peel and coriander." },
    { id: 33, q: "What happens if draft beer line static pressure is lower than the resistance of the tubing?", opts: ["Beer flows too fast and foams", "Beer cannot reach the faucet", "Beer turns cloudy", "Line ruptures"], ans: 1, exp: "If applied pressure does not overcome overall line resistance (gravity and friction), beer flow stalls." },
    { id: 34, q: "Which classic German lager style was traditionally brewed in March and served at Oktoberfest?", opts: ["Schwarzbier", "Märzen", "Maibock", "Dunkel"], ans: 1, exp: "Märzen (March beer) was brewed at the end of the spring brewing season and lagered over summer for autumn consumption." },
    { id: 35, q: "What visual property in a poured beer glass indicates proper 'beer clean' lacing?", opts: ["Thick rings of foam clinging to the glass as it is consumed", "Zero foam on the glass walls", "Bubbles rising continuously from bottom edges", "A greasy film on the rim"], ans: 0, exp: "Parallel rings of foam (lacing) adhere to the clean glass wall after each sip when no residual grease is present." },
    { id: 36, q: "Which off-flavor is produced by wild yeast infections like Brettanomyces in clean lager styles?", opts: ["Horse blanket, barnyard, or Band-Aid", "Clean banana", "Sweet honey", "Bubblegum"], ans: 0, exp: "Brettanomyces generates funky medicinal, horse blanket, and barnyard phenolic flavors." },
    { id: 37, q: "What type of glassware is traditionally recommended for serving Belgian Strong Ales or Abbey Ales?", opts: ["Shaker Pint", "Snifter or Chalice/Goblet", "Dimpled Stein", "Flute"], ans: 1, exp: "Wide-mouthed Chalices or Goblets allow dense head development and aromatic release for complex Belgian ales." },
    { id: 38, q: "What is the correct order of a 3-sink washing station for glassware?", opts: ["Rinse, Wash, Sanitize", "Wash (Hot Water & Soap), Cold Water Rinse, Sanitize", "Sanitize, Wash, Air Dry", "Wash, Sanitize, Towel Dry"], ans: 1, exp: "The 3-sink method requires Sink 1: Hot wash with low-foam detergent; Sink 2: Cold heel-in/heel-out rinse; Sink 3: Chemical sanitizer." },
    { id: 39, q: "Why should beer glassware never be dried with paper towels or cloth napkins?", opts: ["It takes too long", "It leaves lint, dust, and residual oils inside the glass", "It scratches the glass", "It warms the glass up"], ans: 1, exp: "Towel drying transfers lint, dust, and grease to the interior, destroying head retention and sanitation." },
    { id: 40, q: "Which hop variety group is famous for herbal, floral, and spicy notes with low alpha acid content?", opts: ["Noble Hops (Hallertau, Tettnang, Spalt, Saaz)", "New Zealand Hops", "American High-Alpha Hops", "Pacific Northwest Hops"], ans: 0, exp: "Continental European Noble Hops impart subtle spicy, floral, and herbal aromas to classic European lagers." },
    { id: 41, q: "What causes 'beer stone' buildup inside draft lines and hardware?", opts: ["Dust in the air", "Calcium oxalate precipitation from malt and water minerals", "Bacterial infection", "Excessive CO2 pressure"], ans: 1, exp: "Beer stone is calcium oxalate that crystallizes out of beer over time, requiring acid cleaning for removal." },
    { id: 42, q: "What flavor descriptor is associated with high concentrations of fusel alcohols?", opts: ["Soft banana", "Harsh, solvent-like or hot alcohol burn", "Sweet molasses", "Green apple"], ans: 1, exp: "Fusel alcohols result from high fermentation temperatures and present a sharp, solventy burn." },
    { id: 43, q: "Which German ale style is dark copper to brown in color with firm hop bitterness from Düsseldorf?", opts: ["Altbier", "Märzen", "Dunkles Bock", "Schwarzbier"], ans: 0, exp: "Altbier ('old style' ale) originates from Düsseldorf, balancing rich maltiness with clean, firm hop bitterness." },
    { id: 44, q: "What is the typical shelf life of an unpasteurized draft keg stored under cold conditions?", opts: ["10 - 20 days", "45 - 60 days", "120 - 180 days", "1 year"], ans: 1, exp: "Unpasteurized craft draft beer generally maintains peak freshness for 45 to 60 days under proper refrigeration." },
    { id: 45, q: "Which style is characterized by very dark color, high ABV (8-12%+), and intense roast coffee/chocolate notes?", opts: ["Sweet Stout", "Imperial Stout", "Irish Stout", "Porter"], ans: 1, exp: "Imperial Stout (Russian Imperial Stout) exhibits high alcohol strength, intense dark malt roast, and full body." },
    { id: 46, q: "What does 'gravity' measure during the brewing process?", opts: ["Alcohol percentage by volume", "The density of dissolved sugars in the wort relative to water", "Draft pressure inside a keg", "International Bitterness Units"], ans: 1, exp: "Specific gravity measures the concentration of dissolved sugars in wort before and after fermentation." },
    { id: 47, q: "Which off-flavor smells like medicinal Band-Aids, clove, or plastic?", opts: ["Esters", "Phenols", "Diacetyl", "DMS"], ans: 1, exp: "Phenolic compounds (chlorophenols or wild yeast) generate medicinal, plastic, or Band-Aid aromas." },
    { id: 48, q: "What valve design feature on a standard American Sankey D coupler allows gas to enter the keg?", opts: ["Side gas inlet port", "Bottom probe discharge", "Pressure relief ring", "Tailpiece washer"], ans: 0, exp: "Gas enters through the side port of the coupler body, while beer travels up through the center probe." },
    { id: 49, q: "Which beer style features a pale golden color, high carbonation, fruity esters, and spicy phenols with 7.5% - 9.5% ABV?", opts: ["Belgian Tripel", "Belgian Dubbel", "Saison", "Witbier"], ans: 0, exp: "Belgian Tripel is strong, highly attenuated, golden-colored, and complex with yeast-driven spice and fruit." },
    { id: 50, q: "What happens when compressed air is used to push draft beer instead of CO2 or mixed gas?", opts: ["Beer stays fresh indefinitely", "Beer oxidizes and goes stale within 12 - 24 hours", "Beer becomes over-carbonated", "Beer temperature drops rapidly"], ans: 1, exp: "Oxygen in compressed air quickly oxidizes beer, introducing stale cardboard flavors within a day." }
];

// App State
let activePool = [];
let currentIndex = 0;
let userStats = JSON.parse(localStorage.getItem('cicerone_stats')) || { total: 0, correct: 0, bookmarks: [] };

function saveStats() {
    localStorage.setItem('cicerone_stats', JSON.stringify(userStats));
    updateDashboardUI();
}

function updateDashboardUI() {
    document.getElementById('stat-total').innerText = userStats.total;
    const acc = userStats.total > 0 ? Math.round((userStats.correct / userStats.total) * 100) : 0;
    document.getElementById('stat-accuracy').innerText = acc + '%';
    document.getElementById('stat-bookmarks').innerText = userStats.bookmarks.length;
}

function showDashboard() {
    document.getElementById('dashboard-view').classList.remove('hidden');
    document.getElementById('quiz-view').classList.add('hidden');
    document.getElementById('home-btn').classList.add('hidden');
    updateDashboardUI();
}

function startQuiz(count) {
    if (count === 'bookmarks') {
        activePool = questionBank.filter(q => userStats.bookmarks.includes(q.id));
        if (activePool.length === 0) {
            alert('No bookmarked questions available!');
            return;
        }
    } else {
        // Shuffle full bank and grab requested count (no duplicates)
        activePool = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, count);
    }

    currentIndex = 0;
    document.getElementById('dashboard-view').classList.add('hidden');
    document.getElementById('quiz-view').classList.remove('hidden');
    document.getElementById('home-btn').classList.remove('hidden');
    loadQuestion();
}

function loadQuestion() {
    const q = activePool[currentIndex];
    document.getElementById('q-progress').innerText = `Question ${currentIndex + 1}/${activePool.length}`;
    document.getElementById('q-text').innerText = q.q;
   
    // Update Bookmark state
    const isBookmarked = userStats.bookmarks.includes(q.id);
    const bmBtn = document.getElementById('bookmark-toggle');
    bmBtn.classList.toggle('active', isBookmarked);

    // Load options
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx);
        container.appendChild(btn);
    });

    document.getElementById('feedback-box').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
}

function handleAnswer(selectedIdx) {
    const q = activePool[currentIndex];
    const buttons = document.querySelectorAll('.opt-btn');
   
    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.ans) btn.classList.add('correct');
        if (idx === selectedIdx && selectedIdx !== q.ans) btn.classList.add('incorrect');
    });

    userStats.total++;
    if (selectedIdx === q.ans) userStats.correct++;
    saveStats();

    document.getElementById('feedback-text').innerText = q.exp;
    document.getElementById('feedback-box').classList.remove('hidden');
    document.getElementById('next-btn').classList.remove('hidden');
}

function toggleBookmark() {
    const q = activePool[currentIndex];
    const idx = userStats.bookmarks.indexOf(q.id);
    if (idx > -1) {
        userStats.bookmarks.splice(idx, 1);
    } else {
        userStats.bookmarks.push(q.id);
    }
    saveStats();
    document.getElementById('bookmark-toggle').classList.toggle('active', idx === -1);
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < activePool.length) {
        loadQuestion();
    } else {
        alert(`Quiz Complete! Final Score: ${userStats.correct} correct out of ${userStats.total} total overall attempts.`);
        showDashboard();
    }
}

// Initial Setup
updateDashboardUI();
</script>
</body>
</html>
